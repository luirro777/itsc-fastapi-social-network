[project]
name = "clases-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luis Romano", email = "luisromano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "pytest>=8.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
clases-fastapi = "clases_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
